<!doctype html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#0b1220">
  <meta name="csrf-token" content="{{ CSRF }}">
  <title>Bebaa Book Translator – Pekerjaan</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
  <div class="wrap">
    <div class="topbar">
      <h1 style="margin:0">📚 Pekerjaan Terjemahan</h1>
      {% if AUTH_ON %}<a href="/logout">⎋ Keluar</a>{% endif %}
    </div>
    <div id="list"><div class="empty">Memuat…</div></div>
  </div>
  <div class="toast" id="toast"></div>
  <div class="bottom">
    <a href="/"><span class="ic">📤</span>Upload</a>
    <a href="/jobs" class="active"><span class="ic">🗂️</span>Pekerjaan</a>
    <a href="/settings"><span class="ic">⚙️</span>Settings</a>
  </div>
  <script>
    function toast(msg){
      const t=document.getElementById('toast');
      t.textContent=msg; t.style.display='block';
      clearTimeout(window._tt); window._tt=setTimeout(()=>t.style.display='none',3500);
    }

    async function cancelJob(id, name){
      if(!confirm('STOP job ini?\n\n'+name+'\n\nHalaman yang sudah selesai tetap disimpan dan bisa dilanjutkan lagi nanti.')) return;
      try{
        const r=await fetch('/cancel/'+id,{method:'POST',headers:PH});
        const d=await r.json();
        if(d.ok){ toast('Job dihentikan'); setTimeout(load, 1500); }
        else { toast('Gagal: '+(d.msg||'tidak diketahui')); }
      }catch(e){ toast('Gagal menghentikan job'); }
    }

    async function delJob(id, name){
      const msg='HAPUS PERMANEN job ini?\n\n'+name+'\n\nYang dihapus: PDF, semua halaman terjemahan, cache sqlite, gambar, EPUB, log.\n\nTindakan ini TIDAK BISA dibatalkan.';
      if(!confirm(msg)) return;
      if(!confirm('Konfirmasi terakhir: benar-benar hapus permanen?')) return;
      try{
        const r=await fetch('/delete/'+id,{method:'POST',headers:PH});
        const d=await r.json();
        if(d.ok){ toast('Job dihapus ('+(d.freed_mb||0)+' MB dibebaskan)'); load(); }
        else { toast('Gagal: '+(d.msg||'tidak diketahui')); }
      }catch(e){ toast('Gagal menghapus'); }
    }

    async function retryJob(id){
      if(!confirm('Lanjutkan job ini dari halaman yang belum selesai?')) return;
      try{
        const r=await fetch('/retry/'+id,{method:'POST',headers:PH});
        const d=await r.json();
        if(d.ok){ toast('Job dilanjutkan'); setTimeout(load, 1500); }
        else { toast('Gagal: '+(d.msg||'tidak diketahui')); }
      }catch(e){ toast('Gagal melanjutkan'); }
    }

    function esc(s){return (s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}
    const CSRF=document.querySelector('meta[name="csrf-token"]').content;
    const PH={'X-CSRF-Token':CSRF,'X-Requested-With':'fetch'};

    async function load(){
      try{
        const r=await fetch('/api/jobs');
        const data=await r.json();
        const c=document.getElementById('list');
        if(!data.length){c.innerHTML='<div class="empty">Belum ada pekerjaan.<br><a href="/">Upload buku →</a></div>';return;}
        let html='';
        data.forEach(j=>{
          const pct=j.total_pages?(j.last_page/j.total_pages*100):0;
          const col={done:'var(--green)',error:'var(--err)',cancelled:'var(--amber)',running:'var(--accent)'}[j.status]||'var(--accent)';
          const active=(j.status==='running');
          const missing=j.missing_pages||[];
          const safeName=esc(j.filename);

          html+='<div class="job">';
          html+='<span class="status s-'+j.status+'">'+esc(j.status)+'</span>';
          html+='<div class="name">'+esc(j.filename)+'</div>';
          html+='<div class="sub">'+j.last_page+'/'+j.total_pages+' halaman · '+esc(j.started_at||'')+'</div>';
          html+='<div class="pbar sm"><div class="pfill" style="width:'+pct+'%;background:'+col+'"></div></div>';
          html+='<div class="meta">💾 '+(j.size_mb||0)+' MB · cache '+(j.cache_mb||0)+' MB</div>';

          if(j.ready){
            html+='<a class="btn btn-green" style="margin-top:.6rem" href="/download/'+j.id+'">⬇️ Unduh EPUB</a>';
          }
          html+='<a class="btn btn-outline" href="/progress/'+j.id+'">👁 Lihat Detail</a>';
          if(active){
            html+='<button class="btn btn-err" onclick="cancelJob(\''+j.id+'\',\''+safeName+'\')">⏹ Stop Job</button>';
          } else {
            const unfinished=(j.status!=='done');
            if(unfinished){
              const sisa=Math.max(0,(j.total_pages||0)-(j.last_page||0));
              const lbl=missing.length?('▶ Lanjutkan ('+missing.length+' halaman gagal)'):
                      (sisa?('▶ Lanjutkan ('+sisa+' halaman sisa)'):'▶ Lanjutkan');
              html+='<button class="btn btn-amber" style="margin-top:.5rem" onclick="retryJob(\''+j.id+'\')">'+lbl+'</button>';
            }
            html+='<button class="btn btn-err" style="margin-top:.5rem" onclick="delJob(\''+j.id+'\',\''+safeName+'\')">🗑 Hapus Job (bersih total)</button>';
          }
          html+='</div>';
        });
        c.innerHTML=html;
      }catch(e){document.getElementById('list').innerHTML='<div class="empty">Gagal memuat.</div>';}
    }
    setInterval(load,5000);
    load();
  </script>
</body>
</html>
